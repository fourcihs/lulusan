<!DOCTYPE html>
<html>
<head>
    <title>E-Data Entry | BK SMAN 4 Cimahi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* Mengatur dasar halaman jadi Putih Bersih */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background: linear-gradient(135deg, rgba(227, 242, 253, 0.5) 0%, rgba(236, 239, 241, 0.5) 100%);

        }

        .wrapper { 
            position: relative; 
            width: 100%; 
            height: 100vh; 
            overflow: hidden; 
        }

        iframe {
            position: absolute;
            top: -45px; 
            left: 0; 
            width: 100%; 
            height: calc(100% + 45px); 
            border: none;
            padding-top: 25px; 
            padding-bottom: 35px; 
            box-sizing: border-box;
            /* Pastikan background iframe juga putih agar serasi */
            background-color: linear-gradient(135deg, #E3F2FD 0%, #ECEFF1 100%)
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <iframe id="myIframe" src="" allowtransparency="true"></iframe>
    </div>

    <script>
        const queryString = window.location.search;
        const baseUrl = "https://script.google.com/macros/s/AKfycbxa8FGnnMQc_l4lRJBJUFmTqNirVWAnqpmptKWDvTAugVC2t4xXBCys6P2pBY2HNh9VlQ/exec";
        document.getElementById('myIframe').src = baseUrl + queryString;
    </script>
</body>
</html>
